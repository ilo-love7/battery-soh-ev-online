[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evsoh"
version = "1.0.0"
description = "Estimate EV battery capacity and SOH from a single everyday charging snippet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["battery", "SOH", "state-of-health", "electric-vehicle", "incremental-capacity"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
