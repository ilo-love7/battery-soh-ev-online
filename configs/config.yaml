# 项目 A2 配置：路径 / 标签定义 / 特征 / 建模协议
paths:
  # 数据集根目录（相对路径按项目根解析）；可用环境变量 EVBATTERY_ROOT 覆盖
  evbattery_root: "data/EVBattery"
  datasets: ["battery_dataset1", "battery_dataset2", "battery_dataset3"]
  results_dir: "results"
  cache_dir: "results/cache"
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  reports_dir: "reports"
  window_index: "results/cache/window_index.parquet"      # 全量窗口索引（127.8 万行）
  session_features: "results/cache/session_features.parquet"

# 8 列字段顺序（已由数据集说明文档核验）
columns: ["Average_Cell_Voltage", "Charging_Current", "SOC",
          "Max_Cell_Voltage", "Min_Cell_Voltage",
          "Max_Cell_Temperature", "Min_Cell_Temperature", "Timestamp"]

# 窗口可用性判定（只做单窗口体检；SOC 跨度门槛放在会话级）
window_qc:
  n_steps: 128
  min_current_a: 0.5         # 平均 |I| 下限，剔除静置窗口
  max_soc_jump: 30.0         # 单窗口内 SOC 跳变上限（数据异常判据）

# 片段（session）筛选
session_qc:
  min_soc_span: 20.0         # 会话 SOC 跨度下限（%）——低于此不做容量估计
  min_q_ah: 2.0              # 会话累计充入电量下限
  min_duration_s: 300.0      # 会话最短时长
  max_duration_s: 20000.0    # 超长会话多为跨天拼接，剔除

# SOH 标签定义：SOH = capacity / 每车 BOL 参考容量
label:
  bol_ref: "top_decile_median"   # 每车容量标签最高 10% 的中位数作为 BOL 代理
  min_labeled_sessions: 5        # 某车有效容量标签少于该数则不参与建模
  soh_clip: [0.60, 1.15]

# 建模协议
splits:
  random_state: 42
  n_group_folds: 5           # 按车分组 K 折（跨车外推）
  inner_val_frac: 0.15
  test_frac: 0.2             # 同车随机划分（乐观上界）

# 模型
models:
  xgb:
    n_estimators: 900
    max_depth: 6
    learning_rate: 0.04
    subsample: 0.85
    colsample_bytree: 0.8
    min_child_weight: 4
    reg_lambda: 1.5
  rf:
    n_estimators: 400
    max_depth: 16
    min_samples_leaf: 3

# 不确定性量化
uncertainty:
  alphas: [0.05, 0.5, 0.95]  # 90% 区间
  nominal_coverage: 0.90

# 冷启动个性化
coldstart:
  k_list: [0, 1, 2, 3, 5, 8, 12, 20]
  correction: "affine"       # 每车 2 参数仿射校正（收缩到全局解）
  ridge_lambda: 5.0
