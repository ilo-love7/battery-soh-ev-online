name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch (needed to read EVBattery pickles)
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Smoke-test the CLI on the bundled sample sessions
        run: |
          python tools/soh_estimator.py \
            --dir examples/sample_sessions \
            --ref-capacity "18=42.8,62=41.4,383=43.1"
